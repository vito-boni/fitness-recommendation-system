<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beranda - Bije's Gym</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
    <header>
        <h1>Bije's Gym</h1>
        <p>Beranda / Rencana Latihan Saya</p>
    </header>

    <main>
        <nav class="top-nav">
            <a href="../dashboard/index.html" class="active">Beranda</a>
            <a href="../asesmen/index.html">Ambil Asesmen Ulang</a>
            <a href="../profile/index.html">Profil & Akun</a>
            <button type="button" class="secondary" data-action="logout">Keluar</button>
        </nav>

        <section class="card">
            <h2>Rencana Latihan Saya</h2>
            <div id="selectedPlan"></div>
        </section>
    </main>

    <footer>
        <p>Sistem Rekomendasi Program Latihan — Bije's Gym</p>
    </footer>

    <script>
        const API_BASE = `http://${window.location.hostname || 'localhost'}:5001`;
        const container = document.getElementById('selectedPlan');

        async function apiRequest(path, options = {}) {
            const response = await fetch(`${API_BASE}${path}`, {
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options
            });
            const contentType = response.headers.get('content-type') || '';
            const payload = contentType.includes('application/json') ? await response.json() : await response.text();
            if (!response.ok) {
                const message = typeof payload === 'object' && payload
                    ? (payload.error || payload.message)
                    : String(payload || 'Request gagal.');
                const error = new Error(message || 'Request gagal.');
                error.status = response.status;
                throw error;
            }
            return payload;
        }

        document.querySelectorAll('[data-action="logout"]').forEach((button) => {
            button.addEventListener('click', async () => {
                button.disabled = true;
                try {
                    await apiRequest('/api/auth/logout', { method: 'POST' });
                } catch (error) {
                    alert(`Logout gagal: ${error.message}`);
                    button.disabled = false;
                    return;
                }
                window.location.href = '../login/login.html';
            });
        });

        (async function loadDashboard() {
            try {
                const session = (await apiRequest('/api/auth/session')).user;
                const data = await apiRequest('/api/recommendations/current');
                const saved = data.selected_plan;
                const memberLabel = `Halo, ${session.name || 'member'}`;
                if (!saved) {
                    container.innerHTML = `
                        <p class="welcome-text">${memberLabel}</p>
                        <p class="empty">Belum ada program yang dipilih. Silakan pilih rekomendasi yang paling sesuai.</p>
                        <div class="button-row">
                            <a href="../asesmen/index.html" class="inline-link">Kembali ke Asesmen</a>
                            <button type="button" class="secondary" onclick="window.location.href='../profile/index.html'">Profil & Akun</button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <p class="welcome-text">${memberLabel}</p>
                        <div class="recommendation">
                            <h3>${saved.name}</h3>
                            <p><strong>${saved.split}</strong></p>
                            <p>${saved.description}</p>
                            <p class="score">Skor kesesuaian: ${saved.similarity}</p>                            ${saved.plan || '<p>Detail program belum tersedia.</p>'}
                            <div class="button-row">
                                <button type="button" class="secondary" onclick="window.location.href='../asesmen/index.html'">Ambil Asesmen Ulang</button>
                                <button type="button" class="secondary" onclick="window.location.href='../profile/index.html'">Profil & Akun</button>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                if (error.status === 401) {
                    window.location.href = '../login/login.html';
                    return;
                }
                container.innerHTML = `<p class="empty">Data beranda gagal dimuat: ${error.message}</p>`;
            }
        })();
    </script>
</body>
</html>
