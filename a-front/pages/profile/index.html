<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil & Akun - Bije's Gym</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
    <header>
        <h1>Bije's Gym</h1>
        <p>Profil & Akun</p>
    </header>

    <main>
        <nav class="top-nav">
            <a href="../asesmen/index.html">Ambil Asesmen Ulang</a>
            <a href="../dashboard/index.html">Beranda</a>
            <a href="../recommendation/index.html">Hasil Rekomendasi</a>
        </nav>

        <section class="card">
            <h2>Profil Member</h2>
            <form id="profileForm">
                <div class="section-block">
                    <h3>Data Pengguna</h3>
                    <div class="field">
                        <label for="profileName">Nama</label>
                        <input type="text" id="profileName" />
                    </div>
                    <div class="field">
                        <label for="profileUsername">Username</label>
                        <input type="text" id="profileUsername" />
                    </div>
                </div>

                <div class="section-block">
                    <h3>Data Diri</h3>
                    <div class="grid two-col">
                        <div class="field">
                            <label for="age">Umur</label>
                            <input type="number" id="age" min="1" max="99" />
                        </div>
                        <div class="field">
                            <label for="gender">Jenis Kelamin</label>
                            <select id="gender">
                                <option value="">Pilih</option>
                                <option value="L">Laki-laki</option>
                                <option value="P">Perempuan</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid two-col">
                        <div class="field">
                            <label for="height">Tinggi Badan (cm)</label>
                            <input type="number" id="height" min="1" max="250" />
                        </div>
                        <div class="field">
                            <label for="weight">Berat Badan (kg)</label>
                            <input type="number" id="weight" min="1" max="220" step="0.1" />
                        </div>
                    </div>

                    <div class="field">
                        <label for="bodyFat">Persentase Lemak Tubuh</label>
                        <select id="bodyFat">
                            <option value="">Pilih</option>
                            <option value="Tidak tahu">Tidak tahu</option>
                            <option value="Laki-laki: ≤13% | Perempuan: ≤20%">Laki-laki: ≤13% | Perempuan: ≤20%</option>
                            <option value="Laki-laki: 14–17% | Perempuan: 21–24%">Laki-laki: 14–17% | Perempuan: 21–24%</option>
                            <option value="Laki-laki: 18–24% | Perempuan: 25–31%">Laki-laki: 18–24% | Perempuan: 25–31%</option>
                            <option value="Laki-laki: 25–31% | Perempuan: 32–39%">Laki-laki: 25–31% | Perempuan: 32–39%</option>
                            <option value="Laki-laki: ≥32% | Perempuan: ≥40%">Laki-laki: ≥32% | Perempuan: ≥40%</option>
                        </select>
                    </div>
                </div>

                <div class="section-block">
                    <h3>Data Antropometri (cm)</h3>

                    <div class="grid two-col">
                        <div class="field">
                            <label for="waist">Lingkar Perut</label>
                            <input type="number" id="waist" min="0" max="300" step="0.1" />
                        </div>
                        <div class="field">
                            <label for="hip">Lingkar Pinggul</label>
                            <input type="number" id="hip" min="0" max="300" step="0.1" />
                        </div>
                    </div>

                    <div class="grid two-col">
                        <div class="field">
                            <label for="shoulder">Lebar Bahu</label>
                            <input type="number" id="shoulder" min="0" max="300" step="0.1" />
                        </div>
                        <div class="field">
                            <label for="armLength">Panjang Lengan</label>
                            <input type="number" id="armLength" min="0" max="300" step="0.1" />
                        </div>
                    </div>

                    <div class="grid two-col">
                        <div class="field">
                            <label for="legLength">Panjang Tungkai</label>
                            <input type="number" id="legLength" min="0" max="300" step="0.1" />
                        </div>
                        <div class="field">
                            <label for="insideFootLength">Panjang Kaki Bagian Dalam</label>
                            <input type="number" id="insideFootLength" min="0" max="300" step="0.1" />
                        </div>
                    </div>

                    <div class="field">
                        <label for="torsoLength">Panjang Torso</label>
                        <input type="number" id="torsoLength" min="0" max="300" step="0.1" />
                    </div>
                </div>

                <button type="submit">Simpan Profil</button>
                <button type="button" class="secondary" onclick="window.location.href='../dashboard/index.html'">Kembali ke Beranda</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sistem Rekomendasi Program Latihan — Bije's Gym</p>
    </footer>

    <script>
        const API_BASE = `http://${window.location.hostname || 'localhost'}:5001`;
        const bodyFatLabels = [
            'Tidak tahu',
            'Laki-laki: ≤13% | Perempuan: ≤20%',
            'Laki-laki: 14–17% | Perempuan: 21–24%',
            'Laki-laki: 18–24% | Perempuan: 25–31%',
            'Laki-laki: 25–31% | Perempuan: 32–39%',
            'Laki-laki: ≥32% | Perempuan: ≥40%'
        ];
        let sessionUser = null;
        let loadedProfile = {};

        async function apiRequest(path, options = {}) {
            const response = await fetch(`${API_BASE}${path}`, {
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                },
                ...options
            });

            const contentType = response.headers.get('content-type') || '';
            const payload = contentType.includes('application/json') ? await response.json() : await response.text();

            if (!response.ok) {
                const message = typeof payload === 'object' && payload ? (payload.error || payload.message) : String(payload || 'Request gagal.');
                const error = new Error(message || 'Request gagal.');
                error.status = response.status;
                throw error;
            }

            return payload;
        }

        function fillProfile(profile) {
            const fields = {
                profileName: profile.name,
                profileUsername: profile.username,
                age: profile.age,
                gender: profile.gender,
                height: profile.height_cm,
                weight: profile.weight_kg,
                bodyFat: profile.body_fat_percent,
                waist: profile.waist_cm,
                hip: profile.hip_cm,
                shoulder: profile.shoulder_width_cm,
                armLength: profile.arm_length_cm,
                legLength: profile.leg_length_cm,
                insideFootLength: profile.inside_foot_length_cm,
                torsoLength: profile.torso_length_cm
            };

            Object.entries(fields).forEach(([id, value]) => {
                const el = document.getElementById(id);
                if (el) el.value = value || '';
            });
        }

        async function loadProfile() {
            try {
                sessionUser = (await apiRequest('/api/auth/session')).user;
                loadedProfile = await apiRequest(`/api/profile/${encodeURIComponent(sessionUser.username)}`);
                fillProfile(loadedProfile);
            } catch (error) {
                if (error.status === 401) {
                    window.location.href = '../login/login.html';
                    return;
                }
                alert(`Profil gagal dimuat dari database: ${error.message}`);
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            try {
                const username = sessionUser.username;
                const payload = {
                    ...loadedProfile,
                    username: document.getElementById('profileUsername').value.trim(),
                    name: document.getElementById('profileName').value.trim(),
                    age: document.getElementById('age').value,
                    gender: document.getElementById('gender').value,
                    height_cm: document.getElementById('height').value,
                    weight_kg: document.getElementById('weight').value,
                    body_fat_percent: bodyFatLabels.indexOf(document.getElementById('bodyFat').value),
                    waist_cm: document.getElementById('waist').value,
                    hip_cm: document.getElementById('hip').value,
                    shoulder_width_cm: document.getElementById('shoulder').value,
                    arm_length_cm: document.getElementById('armLength').value,
                    leg_length_cm: document.getElementById('legLength').value,
                    inside_foot_length_cm: document.getElementById('insideFootLength').value,
                    torso_length_cm: document.getElementById('torsoLength').value
                };
                if (payload.body_fat_percent < 0) payload.body_fat_percent = '';

                await apiRequest(`/api/profile/${encodeURIComponent(username)}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
                alert('Profil berhasil disimpan.');
                window.location.href = '../dashboard/index.html';
            } catch (error) {
                alert(error.message || 'Profil gagal disimpan.');
            }
        });

        loadProfile().then(() => {
            if (loadedProfile.body_fat_percent !== null && loadedProfile.body_fat_percent !== undefined) {
                document.getElementById('bodyFat').value =
                    bodyFatLabels[Number(loadedProfile.body_fat_percent)] || '';
            }
        });
    </script>
</body>
</html>
